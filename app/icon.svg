<svg width="256" height="256" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4bc96e"/>
      <stop offset="1" stop-color="#33b357"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- pins: 3 per side, extra thick -->
  <g stroke="#000000" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M27 15 V4"/>
    <path d="M50 15 V4"/>
    <path d="M73 15 V4"/>

    <path d="M27 85 V96"/>
    <path d="M50 85 V96"/>
    <path d="M73 85 V96"/>

    <path d="M15 27 H4"/>
    <path d="M15 50 H4"/>
    <path d="M15 73 H4"/>

    <path d="M85 27 H96"/>
    <path d="M85 50 H96"/>
    <path d="M85 73 H96"/>
  </g>

  <!-- die -->
  <rect x="15" y="15" width="70" height="70" rx="9" fill="#0a0a0a" stroke="#000000" stroke-width="7"/>

  <!-- 6-arm star, uneven lengths, thick + glowing -->
  <g filter="url(#glow)">
    <g stroke="#3be3d8" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M45 55 L39 24"/>
      <path d="M45 55 L57 39"/>
      <path d="M45 55 L78 58"/>
      <path d="M45 55 L56 76"/>
      <path d="M45 55 L27 74"/>
      <path d="M45 55 L31 47"/>
    </g>
    <g fill="#3be3d8">
      <circle cx="39" cy="24" r="5.6"/>
      <circle cx="57" cy="39" r="5.6"/>
      <circle cx="78" cy="58" r="5.6"/>
      <circle cx="56" cy="76" r="5.6"/>
      <circle cx="27" cy="74" r="5.6"/>
      <circle cx="31" cy="47" r="5.6"/>
    </g>
    <circle cx="45" cy="55" r="10" fill="#ffb020"/>
  </g>
</svg>
